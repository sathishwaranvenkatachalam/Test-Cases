<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dialog – E2E Test Case Flowchart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: auto;
  }

  header {
    background: #161b27;
    border-bottom: 1px solid #2a3345;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #94b8ff;
    letter-spacing: 0.01em;
  }
  header p { font-size: 12px; color: #64748b; margin-top: 2px; }

  .legend {
    display: flex;
    gap: 20px;
    margin-left: auto;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #94a3b8;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-diamond {
    width: 12px; height: 12px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .canvas-wrap {
    padding: 32px 24px 80px;
    min-width: 1200px;
  }

  svg#tree {
    overflow: visible;
    display: block;
    margin: 0 auto;
  }

  /* Node base styles */
  .node-step rect {
    rx: 6px;
    fill: #1e2533;
    stroke: #334155;
    stroke-width: 1.5;
    transition: fill 0.15s, stroke 0.15s;
  }
  .node-step text { fill: #cbd5e1; font-size: 11px; }

  .node-tc rect {
    fill: #0f3058;
    stroke: #3b82f6;
    stroke-width: 2;
    rx: 4px;
    cursor: pointer;
    transition: fill 0.15s, stroke 0.15s, filter 0.15s;
  }
  .node-tc text { fill: #93c5fd; font-size: 11px; font-weight: 600; cursor: pointer; }

  /* Status colours on leaf nodes */
  .status-Pass rect    { fill: #052e16; stroke: #22c55e; }
  .status-Pass text    { fill: #86efac; }
  .status-Fail rect    { fill: #2d0a0a; stroke: #ef4444; }
  .status-Fail text    { fill: #fca5a5; }
  .status-Partial rect { fill: #1c1306; stroke: #f59e0b; }
  .status-Partial text { fill: #fcd34d; }

  .node-tc:hover rect, .node-tc.highlighted rect {
    filter: brightness(1.6);
    stroke-width: 2.5;
  }
  .node-step.step-highlighted rect {
    fill: #1a3a5c !important;
    stroke: #60a5fa !important;
    stroke-width: 2 !important;
  }
  .node-step.step-dim rect { opacity: 0.25; }
  .node-step.step-dim text { opacity: 0.25; }
  .node-tc.tc-dim rect   { opacity: 0.2; }
  .node-tc.tc-dim text   { opacity: 0.2; }

  .link {
    fill: none;
    stroke: #2a3a50;
    stroke-width: 1.5;
    transition: stroke 0.15s, stroke-width 0.15s;
  }
  .link.link-highlighted { stroke: #3b82f6; stroke-width: 2.5; }
  .link.link-dim { stroke: #1a2230; }

  /* Root node */
  .node-root ellipse { fill: #1e3a5f; stroke: #60a5fa; stroke-width: 2; }
  .node-root text { fill: #bfdbfe; font-size: 12px; font-weight: 700; }

  /* Shared step — has blue left bar and count badge */
  .node-step.step-shared rect:first-of-type { stroke: #2563eb; stroke-width: 1.5; }

  /* Popup */
  #popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #161b27;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 0;
    width: 520px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    z-index: 500;
    box-shadow: 0 24px 60px rgba(0,0,0,0.7);
    display: none;
  }
  #popup.show { display: flex; }
  .popup-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid #2a3345;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .popup-header h2 { font-size: 13px; font-weight: 700; color: #e2e8f0; line-height: 1.4; }
  .popup-close {
    background: none; border: none; color: #64748b;
    font-size: 18px; cursor: pointer; line-height: 1;
    flex-shrink: 0; padding: 2px 4px;
  }
  .popup-close:hover { color: #e2e8f0; }
  .popup-body { overflow-y: auto; padding: 16px 20px 20px; flex: 1; }

  .tc-card {
    background: #0f1117;
    border: 1px solid #2a3345;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .tc-card:last-child { margin-bottom: 0; }
  .tc-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tc-id-badge {
    font-size: 11px; font-weight: 700;
    background: #1e3a5f;
    color: #93c5fd;
    padding: 2px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .tc-scenario { font-size: 12px; font-weight: 600; color: #e2e8f0; }
  .status-badge {
    margin-left: auto;
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px;
    flex-shrink: 0;
  }
  .badge-Pass    { background: #052e16; color: #86efac; border: 1px solid #22c55e; }
  .badge-Fail    { background: #2d0a0a; color: #fca5a5; border: 1px solid #ef4444; }
  .badge-Partial { background: #1c1306; color: #fcd34d; border: 1px solid #f59e0b; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .info-item label { font-size: 10px; color: #64748b; display: block; margin-bottom: 2px; }
  .info-item span  { font-size: 11px; color: #cbd5e1; }

  .steps-label { font-size: 10px; color: #64748b; margin-bottom: 6px; margin-top: 10px; }
  .step-list { display: flex; flex-direction: column; gap: 4px; }
  .step-row {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 11px; color: #94a3b8;
  }
  .step-num {
    font-size: 10px; color: #3b82f6;
    font-weight: 600; min-width: 18px;
    flex-shrink: 0; padding-top: 1px;
  }
  .step-text { color: #cbd5e1; line-height: 1.45; }

  .evidence-box {
    margin-top: 10px;
    background: #0a0f1a;
    border-left: 3px solid #334155;
    border-radius: 0 4px 4px 0;
    padding: 8px 10px;
    font-size: 11px; color: #94a3b8; line-height: 1.5;
  }
  .evidence-label { font-size: 10px; color: #64748b; margin-bottom: 3px; }

  .defect-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .defect-chip {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d;
  }

  /* ── Filter bar ── */
  .filter-bar {
    background: #111827;
    border-bottom: 1px solid #1e2d40;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    position: sticky;
    top: 65px;
    z-index: 99;
  }
  .filter-label {
    font-size: 11px;
    color: #64748b;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px 4px 10px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    background: #1a2030;
  }
  .filter-chip .chip-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .filter-chip .chip-count {
    font-size: 10px;
    opacity: 0.7;
    font-weight: 500;
    margin-left: 2px;
  }
  /* Per-status chip colours */
  .chip-Pass   { border-color: #22c55e; color: #86efac; }
  .chip-Pass .chip-dot   { background: #22c55e; }
  .chip-Fail   { border-color: #ef4444; color: #fca5a5; }
  .chip-Fail .chip-dot   { background: #ef4444; }
  .chip-Partial { border-color: #f59e0b; color: #fcd34d; }
  .chip-Partial .chip-dot { background: #f59e0b; }
  .chip-All    { border-color: #475569; color: #94a3b8; }
  .chip-All .chip-dot    { background: #475569; }

  .filter-chip.active { box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
  .filter-chip.inactive { opacity: 0.38; }
  .filter-chip:hover { opacity: 1 !important; transform: translateY(-1px); }

  .filter-divider {
    width: 1px; height: 18px;
    background: #2a3345;
    margin: 0 4px;
  }
  .filter-reset {
    margin-left: auto;
    font-size: 11px;
    color: #3b82f6;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .filter-reset:hover { background: #1e2d40; }

  /* TC nodes that are filtered out */
  .node-tc.tc-filtered rect { opacity: 0.1 !important; }
  .node-tc.tc-filtered text { opacity: 0.1 !important; }
  .node-tc.tc-filtered { pointer-events: none; }
  .node-step.step-filtered rect { opacity: 0.08 !important; }
  .node-step.step-filtered text { opacity: 0.08 !important; }
  .link.link-filtered { opacity: 0.06 !important; }

  /* ── False positive styles ── */
  .node-tc.fp rect {
    stroke-dasharray: 5 3 !important;
    opacity: 0.75;
  }
  /* FP badge rendered inside SVG as a <g> appended to the tc node */
  .fp-badge rect  { fill: #4c1d95; }
  .fp-badge text  { fill: #c4b5fd; font-size: 9px; font-weight: 700; }

  /* Popup FP section */
  .fp-section {
    margin-top: 14px;
    background: #0a0f1a;
    border: 1px solid #312e81;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .fp-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .fp-section-title {
    font-size: 11px;
    font-weight: 700;
    color: #a78bfa;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fp-section-title .fp-icon { font-size: 13px; }

  .fp-toggle-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1.5px solid #6d28d9;
    background: transparent;
    color: #a78bfa;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .fp-toggle-btn:hover { background: #1e1b4b; }
  .fp-toggle-btn.is-fp {
    background: #4c1d95;
    border-color: #7c3aed;
    color: #ddd6fe;
  }
  .fp-toggle-btn.is-fp:hover { background: #5b21b6; }

  .fp-note-area {
    width: 100%;
    background: #0f172a;
    border: 1px solid #2a3345;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 11px;
    font-family: inherit;
    padding: 8px 10px;
    resize: vertical;
    min-height: 60px;
    line-height: 1.5;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }
  .fp-note-area:focus { outline: none; border-color: #6d28d9; }
  .fp-note-area::placeholder { color: #475569; }
  .fp-note-label { font-size: 10px; color: #64748b; margin-bottom: 4px; display: block; }

  .fp-save-btn {
    margin-top: 8px;
    padding: 4px 14px;
    border-radius: 5px;
    border: none;
    background: #5b21b6;
    color: #ddd6fe;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .fp-save-btn:hover { background: #6d28d9; }
  .fp-saved-toast {
    font-size: 10px;
    color: #86efac;
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .fp-saved-toast.show { opacity: 1; }

  .fp-meta {
    font-size: 10px;
    color: #64748b;
    margin-top: 6px;
  }

  /* FP chip in filter bar */
  .chip-FP { border-color: #7c3aed; color: #c4b5fd; }
  .chip-FP .chip-dot { background: #7c3aed; }

  /* Summary pill */
  .filter-summary {
    font-size: 11px;
    color: #475569;
    margin-left: 6px;
  }
  .filter-summary span { color: #94b8ff; font-weight: 600; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 499;
    display: none;
  }
  #overlay.show { display: block; }

  .tooltip {
    position: fixed;
    background: #1e2533;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    color: #cbd5e1;
    pointer-events: none;
    z-index: 300;
    max-width: 260px;
    line-height: 1.5;
    display: none;
  }
</style>
</head>

<header>
  <div>
    <h1>Employee Dialog — E2E Test Case Hierarchy</h1>
    <p>Shared steps · Click leaf nodes for details · Hover steps/nodes to trace flows</p>
  </div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#1e2533;border:1px solid #334155"></div> Step
    </div>

    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#0f3058;border:2px solid #3b82f6"></div> Test Case
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#052e16;border:1px solid #22c55e"></div> Pass
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#2d0a0a;border:1px solid #ef4444"></div> Fail
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#1c1306;border:1px solid #f59e0b"></div> Partial
    </div>
    <div class="legend-item" style="border-left:1px solid #2a3345;padding-left:16px;">
      <div class="legend-dot" style="background:#4c1d95;border:1.5px dashed #7c3aed"></div> False Positive
    </div>
  </div>
</header>

<div class="filter-bar" id="filter-bar">
  <span class="filter-label">Filter</span>
  <div class="filter-group" id="filter-chips">
    <!-- injected by JS -->
  </div>
  <div class="filter-divider"></div>
  <span class="filter-summary" id="filter-summary"></span>
  <button class="filter-reset" id="filter-reset">Reset</button>
</div>

<div class="canvas-wrap">
  <svg id="tree"></svg>
</div>

<div id="overlay"></div>
<div id="popup">
  <div class="popup-header">

    <button class="popup-close" id="popup-close">✕</button>
  </div>
  <div class="popup-body" id="popup-body"></div>
</div>
<div class="tooltip" id="tooltip"></div>

// ─────────────────────────────────────────────
// BUILD TREE STRUCTURE — cross-module trie
// Steps are normalised and shared across ALL test
// cases regardless of module, so every genuinely
// common path (Login → Navigate → Open Personnel
// → …) appears exactly once in the tree.
// Modules are shown as colour-coded tags on leaf
// nodes, not as structural separators.
// ─────────────────────────────────────────────

// Normalise step text for deduplication
function normStep(s) {
  return s.toLowerCase()
    .replace(/[.,!?;:→]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Canonicalise step labels that mean the same thing
// across different test cases so the trie merges them.
const STEP_ALIASES = [
  // "Navigate to Company → Company Administration → Personnel"
  // vs "Navigate to Company." then "Open Company Administration." then "Open Personnel."
  // We keep them distinct — the trie will merge them only when text is literally identical.
  // What we DO normalise: trailing punctuation, leading/trailing whitespace (done above).
];

// ── Build trie ──────────────────────────────
// Each trie node: { id, stepText, normText, children[], belongsTo[] }
// Root is a virtual "start" node.

let _stepCounter = 0;
function makeStepId() { return 'sn' + (++_stepCounter); }

// Insert one TC's steps into the trie starting at `parent`
function trieInsert(parent, steps, tcId) {
  if (!steps.length) {
    // Attach TC leaf
    const leaf = { id: tcId, label: tcId, type: 'tc', tc: RAW.find(r => r.id === tcId), children: [], belongsTo: [tcId] };
    parent.children.push(leaf);
    return;
  }
  const [head, ...tail] = steps;
  const norm = normStep(head);
  // Look for existing child with same normalised text
  let child = parent.children.find(c => c.type === 'step' && c.normText === norm);
  if (child) {
    child.belongsTo.push(tcId);
  } else {
    child = { id: makeStepId(), label: head, stepText: head, normText: norm, type: 'step', children: [], belongsTo: [tcId] };
    parent.children.push(child);
  }
  trieInsert(child, tail, tcId);
}

// ── Collapse lone-child step chains ──────────
// If a step node has exactly one child and that child is also a step,
// they form an unbranching chain — keep them as-is (each is a real step).
// We do NOT collapse them so each step stays visible and hoverable.

// ── Build the root ───────────────────────────
const trieRoot = { id: 'root', label: 'Employee\nDialog', type: 'root', children: [], belongsTo: [] };

// Insert in ID order
[...RAW].sort((a, b) => a.id.localeCompare(b.id)).forEach(tc => {
  trieInsert(trieRoot, tc.steps, tc.id);
});

// ── Identify the "open employee" branch vs "add employee" branch ─────
// Rather than hard-coding, we let the trie do it naturally.
// But we annotate step nodes whose first child is still a step (not a TC)
// to help the layout treat long unbranching chains compactly.

const tree = trieRoot;

// ─────────────────────────────────────────────
// LAYOUT — width-first trie layout
// ─────────────────────────────────────────────

const STEP_W = 210, STEP_H_BASE = 32, STEP_LINE_H = 13;
const TC_W   = 116, TC_H = 34;
const HGAP   = 20,  VGAP = 52;
const ROOT_W = 150, ROOT_H = 44;

// Pre-compute wrapped lines and node height for every step node
function estimateLines(text, maxW) {
  const charW = 6.1;
  const usable = maxW - 18;
  const words = text.split(' ');
  let lines = 1, cur = 0;
  words.forEach(w => {
    const ww = (w.length + 1) * charW;
    if (cur + ww > usable && cur > 0) { lines++; cur = ww; }
    else cur += ww;
  });
  return lines;
}

function nodeH(n) {
  if (n.type === 'root') return ROOT_H;
  if (n.type === 'tc')   return TC_H;
  if (n._h) return n._h;
  const lines = estimateLines(n.stepText || n.label, STEP_W);
  n._h = Math.max(STEP_H_BASE, lines * STEP_LINE_H + 10);
  return n._h;
}

// Bottom-up subtree width
function layoutNode(node) {
  if (!node.children.length) {
    node.subtreeW = node.type === 'step' ? STEP_W : TC_W;
    return;
  }
  node.children.forEach(c => layoutNode(c));
  const totalChildren = node.children.reduce((s, c) => s + c.subtreeW, 0)
                      + Math.max(0, node.children.length - 1) * HGAP;
  const selfW = node.type === 'root' ? ROOT_W : node.type === 'step' ? STEP_W : TC_W;
  node.subtreeW = Math.max(selfW, totalChildren);
}

// Top-down X assignment — children centred under parent
function assignX(node, x) {
  node.x = x + node.subtreeW / 2;
  let cx = x;
  node.children.forEach(c => {
    assignX(c, cx);
    cx += c.subtreeW + HGAP;
  });
}

// Top-down Y — each node sits below its parent using actual heights
function assignY(node, y) {
  node.y = y;
  const myH = nodeH(node);
  node.children.forEach(c => assignY(c, y + myH + VGAP));
}

layoutNode(tree);
assignX(tree, 0);
assignY(tree, 40);

// SVG canvas size
let maxX = 0, maxY = 0;
function walkBounds(n) {
  const hw = n.type === 'step' ? STEP_W / 2 : n.type === 'root' ? ROOT_W / 2 : TC_W / 2;
  maxX = Math.max(maxX, n.x + hw);
  maxY = Math.max(maxY, n.y + nodeH(n));
  n.children.forEach(walkBounds);
}
walkBounds(tree);
const svgW = maxX + 40;
const svgH = maxY + 40;

// ─────────────────────────────────────────────
// RENDER SVG
// ─────────────────────────────────────────────
const svg = document.getElementById('tree');
svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
svg.setAttribute('width', svgW);
svg.setAttribute('height', svgH);

function wrapText(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(test.length * 6.2 > maxW - 16) {
      if(cur) lines.push(cur);
      cur = w;
    } else { cur = test; }
  });
  if(cur) lines.push(cur);
  return lines;
}

const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
svg.appendChild(defs);

const links = document.createElementNS('http://www.w3.org/2000/svg','g');
links.setAttribute('class','links');
svg.appendChild(links);
const nodes = document.createElementNS('http://www.w3.org/2000/svg','g');
nodes.setAttribute('class','nodes');
svg.appendChild(nodes);

const nodeEls = {}; // id → SVG g element
const linkEls = []; // {el, from, to}

function makePath(x1,y1,x2,y2) {
  const mid = (y1+y2)/2;
  return `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`;
}

// Module colour map for leaf tags
const MOD_COLORS = {
  'Personnel':               { bg:'#1e293b', stroke:'#60a5fa', text:'#93c5fd' },
  'Personnel / Account':     { bg:'#1a1f35', stroke:'#818cf8', text:'#a5b4fc' },
  'Personnel / Details':     { bg:'#1a2a1a', stroke:'#4ade80', text:'#86efac' },
  'Personnel / Logo':        { bg:'#291e20', stroke:'#f87171', text:'#fca5a5' },
  'Personnel / Relatives':   { bg:'#1e2935', stroke:'#38bdf8', text:'#7dd3fc' },
  'Personnel / Benefits':    { bg:'#1f2a1a', stroke:'#a3e635', text:'#d9f99d' },
  'Personnel / Education':   { bg:'#281e30', stroke:'#c084fc', text:'#d8b4fe' },
  'Personnel / Trainings':   { bg:'#291e20', stroke:'#fb923c', text:'#fdba74' },
  'Personnel / Attachments': { bg:'#1e2625', stroke:'#2dd4bf', text:'#99f6e4' },
  'Personnel / Licenses':    { bg:'#291e26', stroke:'#f472b6', text:'#f9a8d4' },
  'Personnel / Projects':    { bg:'#1a2030', stroke:'#facc15', text:'#fde047' },
};

function renderNode(n) {
  // Draw link from parent
  if (n.parent) {
    const p = n.parent;
    const fromY = p.y + nodeH(p);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'link');
    path.setAttribute('d', makePath(p.x, fromY, n.x, n.y));
    path.dataset.from = p.id;
    path.dataset.to   = n.id;
    links.appendChild(path);
    linkEls.push({ el: path, from: p.id, to: n.id });
  }

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  nodeEls[n.id] = g;

  // ── Root node ──────────────────────────────
  if (n.type === 'root') {
    g.setAttribute('class', 'node-root');
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    el.setAttribute('cx', n.x); el.setAttribute('cy', n.y + ROOT_H / 2);
    el.setAttribute('rx', ROOT_W / 2); el.setAttribute('ry', ROOT_H / 2);
    g.appendChild(el);
    const lns = wrapText(n.label, ROOT_W);
    lns.forEach((l, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', n.x);
      t.setAttribute('y', n.y + ROOT_H / 2 - (lns.length - 1) * 7 + i * 14);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
      t.textContent = l; g.appendChild(t);
    });

  // ── Step node ──────────────────────────────
  } else if (n.type === 'step') {
    // Shared step indicator: steps used by >1 TC get a faint left accent
    const isShared = n.belongsTo.length > 1;
    g.setAttribute('class', 'node-step' + (isShared ? ' step-shared' : ''));
    g.dataset.stepId    = n.id;
    g.dataset.belongsTo = JSON.stringify(n.belongsTo);

    const h   = nodeH(n);
    const lns = wrapText(n.stepText || n.label, STEP_W);

    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', n.x - STEP_W / 2); r.setAttribute('y', n.y);
    r.setAttribute('width', STEP_W); r.setAttribute('height', h);
    r.setAttribute('rx', 5);
    g.appendChild(r);

    // Shared badge — thin coloured bar on left edge
    if (isShared) {
      const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bar.setAttribute('x', n.x - STEP_W / 2); bar.setAttribute('y', n.y);
      bar.setAttribute('width', 3); bar.setAttribute('height', h);
      bar.setAttribute('rx', 2);
      bar.setAttribute('fill', '#3b82f6');
      bar.setAttribute('opacity', '0.7');
      g.appendChild(bar);

      // Tiny "×N" shared count badge top-right
      const badgeW = 24, badgeH = 13;
      const bx = n.x + STEP_W / 2 - badgeW - 2;
      const by = n.y + 2;
      const br = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      br.setAttribute('x', bx); br.setAttribute('y', by);
      br.setAttribute('width', badgeW); br.setAttribute('height', badgeH);
      br.setAttribute('rx', 3); br.setAttribute('fill', '#1e3a5f');
      g.appendChild(br);
      const bt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      bt.setAttribute('x', bx + badgeW / 2); bt.setAttribute('y', by + badgeH / 2);
      bt.setAttribute('text-anchor', 'middle'); bt.setAttribute('dominant-baseline', 'middle');
      bt.setAttribute('fill', '#60a5fa'); bt.setAttribute('font-size', '8');
      bt.setAttribute('font-weight', '700');
      bt.textContent = `×${n.belongsTo.length}`;
      g.appendChild(bt);
    }

    lns.forEach((l, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', n.x + (isShared ? 3 : 0));
      t.setAttribute('y', n.y + h / 2 - (lns.length - 1) * STEP_LINE_H / 2 + i * STEP_LINE_H);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
      t.textContent = l; g.appendChild(t);
    });

  // ── TC leaf node ───────────────────────────
  } else if (n.type === 'tc') {
    const st  = n.tc.status;
    const mod = n.tc.module;
    const mc  = MOD_COLORS[mod] || MOD_COLORS['Personnel'];

    g.setAttribute('class', `node-tc status-${st}`);
    g.dataset.tcId = n.id;
    g.style.cursor = 'pointer';

    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', n.x - TC_W / 2); r.setAttribute('y', n.y);
    r.setAttribute('width', TC_W); r.setAttribute('height', TC_H);
    r.setAttribute('rx', 5);
    g.appendChild(r);

    // TC id label
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y + 13);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
    t.textContent = n.id; g.appendChild(t);

    // Module tag below TC id
    const modShort = mod.replace('Personnel / ', '').replace('Personnel', 'Main');
    const tagW = Math.min(TC_W - 8, modShort.length * 5.8 + 10);
    const tagX = n.x - tagW / 2;
    const tagY = n.y + TC_H - 14;

    const tr = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    tr.setAttribute('x', tagX); tr.setAttribute('y', tagY);
    tr.setAttribute('width', tagW); tr.setAttribute('height', 11);
    tr.setAttribute('rx', 2); tr.setAttribute('fill', mc.bg);
    tr.setAttribute('stroke', mc.stroke); tr.setAttribute('stroke-width', '0.8');
    g.appendChild(tr);

    const tt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tt.setAttribute('x', n.x); tt.setAttribute('y', tagY + 5.5);
    tt.setAttribute('text-anchor', 'middle'); tt.setAttribute('dominant-baseline', 'middle');
    tt.setAttribute('fill', mc.text); tt.setAttribute('font-size', '7.5');
    tt.setAttribute('font-weight', '600');
    tt.textContent = modShort;
    g.appendChild(tt);
  }

  nodes.appendChild(g);
  n.children.forEach(c => { c.parent = n; renderNode(c); });
}

renderNode(tree);

// ─────────────────────────────────────────────
// INTERACTION HELPERS
// ─────────────────────────────────────────────

// Collect ancestry path for a TC leaf
function getAllNodes(n, acc=[]) { acc.push(n); n.children.forEach(c=>getAllNodes(c,acc)); return acc; }
const allNodes = getAllNodes(tree);

function getAncestors(tcId) {
  // Walk tree to find node with id, return path
  function find(n, path=[]) {
    if(n.id === tcId) return [...path, n];
    for(const c of n.children) {
      const r = find(c, [...path, n]);
      if(r) return r;
    }
    return null;
  }
  return find(tree) || [];
}

function getNodeById(id) { return allNodes.find(n=>n.id===id); }

function getDescendantIds(n) {
  const ids = [n.id];
  n.children.forEach(c => ids.push(...getDescendantIds(c)));
  return ids;
}

// ─────────────────────────────────────────────
// HOVER ON LEAF: highlight full path
// ─────────────────────────────────────────────
document.querySelectorAll('.node-tc').forEach(el => {
  el.addEventListener('mouseenter', function(e) {
    const tcId = this.dataset.tcId;
    const path = getAncestors(tcId);
    const pathIds = new Set(path.map(n=>n.id));

    // Dim everything
    allNodes.forEach(n => {
      const el = nodeEls[n.id];
      if(!el) return;
      if(n.type==='step') el.classList.add('step-dim');
      if(n.type==='tc') el.classList.add('tc-dim');
    });
    linkEls.forEach(l => { l.el.classList.add('link-dim'); l.el.classList.remove('link-highlighted'); });

    // Highlight path
    path.forEach(n => {
      const el = nodeEls[n.id];
      if(!el) return;
      el.classList.remove('step-dim','tc-dim');
      el.classList.add('step-highlighted');
    });
    linkEls.forEach(l => {
      if(pathIds.has(l.from) && pathIds.has(l.to)) {
        l.el.classList.remove('link-dim');
        l.el.classList.add('link-highlighted');
      }
    });

    showTooltip(e, `Click to see details for ${tcId}`);
  });

  el.addEventListener('mouseleave', function() {
    clearHighlights();
    hideTooltip();
  });

  el.addEventListener('click', function(e) {
    e.stopPropagation();
    const tcId = this.dataset.tcId;
    openPopup([tcId]);
  });
});

// ─────────────────────────────────────────────
// HOVER ON STEP: show all TCs that include this step
// ─────────────────────────────────────────────
document.querySelectorAll('.node-step').forEach(el => {
  el.addEventListener('mouseenter', function(e) {
    const belongsTo = JSON.parse(this.dataset.belongsTo || '[]');
    const stepId = this.dataset.stepId;

    // Collect all paths for all TCs using this step
    const allPathIds = new Set();
    belongsTo.forEach(tcId => {
      const path = getAncestors(tcId);
      path.forEach(n => allPathIds.add(n.id));
    });

    // Dim non-involved
    allNodes.forEach(n => {
      const el = nodeEls[n.id];
      if(!el) return;
      if(!allPathIds.has(n.id)) {
        if(n.type==='step') el.classList.add('step-dim');
        if(n.type==='tc') el.classList.add('tc-dim');
      }
    });
    linkEls.forEach(l => {
      if(allPathIds.has(l.from) && allPathIds.has(l.to)) {
        l.el.classList.add('link-highlighted');
        l.el.classList.remove('link-dim');
      } else {
        l.el.classList.add('link-dim');
      }
    });
    // Highlight this step specially
    nodeEls[stepId] && nodeEls[stepId].classList.add('step-highlighted');

    const tcLabels = belongsTo.join(', ');
    showTooltip(e, `Used by: ${tcLabels}`);
  });

  el.addEventListener('mouseleave', function() {
    clearHighlights();
    hideTooltip();
  });
});

function clearHighlights() {
  allNodes.forEach(n => {
    const el = nodeEls[n.id];
    if(!el) return;
    el.classList.remove('step-dim','tc-dim','step-highlighted','highlighted','tc-dim');
  });
  linkEls.forEach(l => {
    l.el.classList.remove('link-dim','link-highlighted');
  });
}

// ─────────────────────────────────────────────
// FALSE POSITIVE — localStorage persistence
// ─────────────────────────────────────────────
const FP_KEY = 'emp_dialog_false_positives';

function loadFP() {
  try { return JSON.parse(localStorage.getItem(FP_KEY) || '{}'); }
  catch { return {}; }
}
function saveFP(data) {
  localStorage.setItem(FP_KEY, JSON.stringify(data));
}
function isFP(tcId) { return !!loadFP()[tcId]; }
function getFPNote(tcId) { return (loadFP()[tcId] || {}).note || ''; }
function getFPDate(tcId) { return (loadFP()[tcId] || {}).date || ''; }

function setFP(tcId, marked, note) {
  const data = loadFP();
  if(marked) {
    data[tcId] = { note: note || '', date: new Date().toISOString() };
  } else {
    delete data[tcId];
  }
  saveFP(data);
}

function fpCount() { return Object.keys(loadFP()).length; }

// Apply FP visual to a TC SVG node
function applyFPVisual(tcId) {
  const el = nodeEls[tcId];
  if(!el) return;
  const fp = isFP(tcId);
  if(fp) {
    el.classList.add('fp');
    // Add badge if not present
    if(!el.querySelector('.fp-badge')) {
      const node = allNodes.find(n => n.id === tcId);
      if(node) {
        const bg = document.createElementNS('http://www.w3.org/2000/svg','g');
        bg.setAttribute('class','fp-badge');
        const br = document.createElementNS('http://www.w3.org/2000/svg','rect');
        br.setAttribute('x', node.x + 30); br.setAttribute('y', node.y - 8);
        br.setAttribute('width', 22); br.setAttribute('height', 13);
        br.setAttribute('rx', 3);
        const bt = document.createElementNS('http://www.w3.org/2000/svg','text');
        bt.setAttribute('x', node.x + 41); bt.setAttribute('y', node.y - 1);
        bt.setAttribute('text-anchor','middle'); bt.setAttribute('dominant-baseline','middle');
        bt.textContent = 'FP';
        bg.appendChild(br); bg.appendChild(bt);
        el.appendChild(bg);
      }
    }
  } else {
    el.classList.remove('fp');
    const badge = el.querySelector('.fp-badge');
    if(badge) badge.remove();
  }
}

function applyAllFPVisuals() {
  RAW.forEach(tc => applyFPVisual(tc.id));
}

// ─────────────────────────────────────────────
// POPUP
// ─────────────────────────────────────────────
function openPopup(tcIds) {
  const tcs = tcIds.map(id => RAW.find(r=>r.id===id)).filter(Boolean);
  if(!tcs.length) return;

  document.getElementById('popup-title').textContent =
    tcs.length === 1 ? `${tcs[0].id} — ${tcs[0].scenario}` : `${tcs.length} Test Cases`;

  const body = document.getElementById('popup-body');
  body.innerHTML = '';

  tcs.forEach(tc => {
    const card = document.createElement('div');
    card.className = 'tc-card';
    const defects = tc.defects ? tc.defects.split(',').map(d=>d.trim()).filter(Boolean) : [];
    const fp = isFP(tc.id);
    const fpNote = getFPNote(tc.id);
    const fpDate = getFPDate(tc.id);

    card.innerHTML = `
      <div class="tc-card-header">
        <span class="tc-id-badge">${tc.id}</span>
        <span class="tc-scenario">${tc.scenario}</span>
        <span class="status-badge badge-${tc.status}">${tc.status}</span>
        ${fp ? `<span style="font-size:10px;background:#4c1d95;color:#c4b5fd;border:1px solid #6d28d9;padding:2px 7px;border-radius:4px;flex-shrink:0;">FP</span>` : ''}
      </div>
      <div class="info-grid">
        <div class="info-item"><label>Module</label><span>${tc.module}</span></div>
        <div class="info-item"><label>Priority</label><span>${tc.priority}</span></div>
        <div class="info-item"><label>Type</label><span>${tc.type}</span></div>
        <div class="info-item"><label>Steps</label><span>${tc.steps.length}</span></div>
      </div>
      <div class="info-item" style="margin-bottom:6px"><label>Objective</label><span>${tc.objective}</span></div>
      <div class="steps-label">TEST STEPS</div>
      <div class="step-list">${tc.steps.map((s,i)=>`
        <div class="step-row">
          <span class="step-num">${i+1}.</span>
          <span class="step-text">${s}</span>
        </div>`).join('')}
      </div>
      ${tc.evidence ? `<div class="evidence-box"><div class="evidence-label">ACTUAL RESULT / EVIDENCE</div>${tc.evidence}</div>` : ''}
      ${defects.length ? `<div class="defect-chips">${defects.map(d=>`<span class="defect-chip">${d}</span>`).join('')}</div>` : ''}

      <div class="fp-section">
        <div class="fp-section-header">
          <span class="fp-section-title"><span class="fp-icon">⚑</span> False Positive</span>
          <button class="fp-toggle-btn ${fp ? 'is-fp' : ''}" data-tcid="${tc.id}">
            ${fp ? '✓ Marked as FP' : 'Mark as FP'}
          </button>
        </div>
        <div class="fp-note-wrap" style="${!fp ? 'display:none' : ''}">
          <label class="fp-note-label">Reason / Notes</label>
          <textarea class="fp-note-area" data-tcid="${tc.id}" placeholder="Why is this a false positive? e.g. env issue, flaky dependency…">${fpNote}</textarea>
          <div style="display:flex;align-items:center;">
            <button class="fp-save-btn" data-tcid="${tc.id}">Save note</button>
            <span class="fp-saved-toast" data-tcid="${tc.id}">Saved ✓</span>
          </div>
          ${fpDate ? `<div class="fp-meta">Marked ${new Date(fpDate).toLocaleString()}</div>` : ''}
        </div>
      </div>
    `;
    body.appendChild(card);

    // Wire up toggle
    const toggleBtn = card.querySelector('.fp-toggle-btn');
    const noteWrap  = card.querySelector('.fp-note-wrap');
    const noteArea  = card.querySelector('.fp-note-area');
    const saveBtn   = card.querySelector('.fp-save-btn');
    const toast     = card.querySelector('.fp-saved-toast');

    toggleBtn.addEventListener('click', () => {
      const nowFP = isFP(tc.id);
      setFP(tc.id, !nowFP, nowFP ? '' : (noteArea ? noteArea.value : ''));
      applyFPVisual(tc.id);
      updateFPFilterChip();
      // Re-render this card in place
      openPopup(tcIds);
    });

    if(saveBtn) {
      saveBtn.addEventListener('click', () => {
        setFP(tc.id, true, noteArea.value);
        applyFPVisual(tc.id);
        updateFPFilterChip();
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      });
    }
  });

  document.getElementById('popup').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('popup-close').addEventListener('click', closePopup);
document.getElementById('overlay').addEventListener('click', closePopup);
function closePopup() {
  document.getElementById('popup').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ─────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, text) {
  tooltip.textContent = text;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY - 10;
  if(x + 280 > window.innerWidth) x = e.clientX - 280;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }
document.addEventListener('mousemove', e => {
  if(tooltip.style.display === 'block') moveTooltip(e);
});

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────

// Derive all statuses dynamically from data
const ALL_STATUSES = [...new Set(RAW.map(t => t.status))].sort();
const STATUS_COUNTS = {};
ALL_STATUSES.forEach(s => { STATUS_COUNTS[s] = RAW.filter(t => t.status === s).length; });

// FP filter chip — separate from status chips; sits after divider
const FP_FILTER_ID = '__FP__';
let fpFilterActive = false;

function updateFPFilterChip() {
  const existing = document.getElementById('fp-filter-chip');
  const count = fpCount();
  if(existing) {
    existing.querySelector('.chip-count').textContent = count;
    existing.className = `filter-chip chip-FP ${fpFilterActive ? 'active' : count === 0 ? 'inactive' : ''}`;
  }
  updateFilterSummary();
}

// Active filter set — empty means "show all"
let activeFilters = new Set(); // empty = All

function buildFilterChips() {
  const container = document.getElementById('filter-chips');
  container.innerHTML = '';
  const noStatusFilter = activeFilters.size === 0 && !fpFilterActive;

  // "All" chip
  const allChip = document.createElement('div');
  allChip.className = 'filter-chip chip-All ' + (noStatusFilter ? 'active' : 'inactive');
  allChip.innerHTML = `<span class="chip-dot"></span>All<span class="chip-count">${RAW.length}</span>`;
  allChip.addEventListener('click', () => {
    activeFilters.clear();
    fpFilterActive = false;
    applyFilter();
  });
  container.appendChild(allChip);

  // Status chips
  ALL_STATUSES.forEach(status => {
    const chip = document.createElement('div');
    chip.className = `filter-chip chip-${status} ${activeFilters.has(status) ? 'active' : noStatusFilter ? '' : 'inactive'}`;
    chip.innerHTML = `<span class="chip-dot"></span>${status}<span class="chip-count">${STATUS_COUNTS[status]}</span>`;
    chip.addEventListener('click', () => {
      fpFilterActive = false;
      activeFilters.has(status) ? activeFilters.delete(status) : activeFilters.add(status);
      applyFilter();
    });
    container.appendChild(chip);
  });

  // Divider
  const sep = document.createElement('div');
  sep.style.cssText = 'width:1px;height:18px;background:#2a3345;margin:0 4px;flex-shrink:0;align-self:center;';
  container.appendChild(sep);

  // False Positive chip
  const count = fpCount();
  const fpChip = document.createElement('div');
  fpChip.id = 'fp-filter-chip';
  fpChip.className = `filter-chip chip-FP ${fpFilterActive ? 'active' : count === 0 ? 'inactive' : ''}`;
  fpChip.title = count === 0 ? 'No false positives marked yet' : 'Show only false positive test cases';
  fpChip.innerHTML = `<span class="chip-dot"></span>False Positive<span class="chip-count">${count}</span>`;
  fpChip.addEventListener('click', () => {
    if(count === 0) return;
    fpFilterActive = !fpFilterActive;
    if(fpFilterActive) activeFilters.clear();
    applyFilter();
  });
  container.appendChild(fpChip);
}

function applyFilter() {
  clearHighlights();
  buildFilterChips();
  updateFilterSummary();

  // Determine which TC ids pass the current filter
  const fpData = loadFP();
  const visibleTcIds = new Set(
    RAW.filter(t => {
      if(fpFilterActive) return !!fpData[t.id];
      if(activeFilters.size === 0) return true;
      return activeFilters.has(t.status);
    }).map(t => t.id)
  );

  // First pass: mark TC leaves
  allNodes.forEach(n => {
    const el = nodeEls[n.id];
    if(!el) return;
    if(n.type === 'tc') {
      visibleTcIds.has(n.id) ? el.classList.remove('tc-filtered') : el.classList.add('tc-filtered');
    }
  });

  // Second pass: step nodes visible if any descendant TC is visible
  function hasVisibleDescendantTc(node) {
    if(node.type === 'tc') return visibleTcIds.has(node.id);
    return node.children.some(c => hasVisibleDescendantTc(c));
  }

  allNodes.forEach(n => {
    const el = nodeEls[n.id];
    if(!el) return;
    if(n.type === 'step') {
      hasVisibleDescendantTc(n) ? el.classList.remove('step-filtered') : el.classList.add('step-filtered');
    }
  });

  // Links
  linkEls.forEach(l => {
    const fromNode = getNodeById(l.from);
    const toNode   = getNodeById(l.to);
    const fromOk = fromNode ? (fromNode.type === 'root' || hasVisibleDescendantTc(fromNode)) : true;
    const toOk   = toNode   ? (toNode.type === 'tc' ? visibleTcIds.has(toNode.id) : hasVisibleDescendantTc(toNode)) : true;
    (!fromOk || !toOk) ? l.el.classList.add('link-filtered') : l.el.classList.remove('link-filtered');
  });
}

function updateFilterSummary() {
  const summary = document.getElementById('filter-summary');
  const fpData = loadFP();
  const visible = RAW.filter(t => {
    if(fpFilterActive) return !!fpData[t.id];
    if(activeFilters.size === 0) return true;
    return activeFilters.has(t.status);
  }).length;
  const fpC = fpCount();

  if(fpFilterActive) {
    summary.innerHTML = `<span>${visible}</span> of ${RAW.length} shown &mdash; False Positives`;
  } else if(activeFilters.size === 0) {
    summary.innerHTML = `Showing <span>${visible}</span> of ${RAW.length} test cases${fpC > 0 ? ` &middot; <span style="color:#a78bfa">${fpC} FP marked</span>` : ''}`;
  } else {
    summary.innerHTML = `<span>${visible}</span> of ${RAW.length} shown &mdash; ${[...activeFilters].join(', ')}`;
  }
}

document.getElementById('filter-reset').addEventListener('click', () => {
  activeFilters.clear();
  fpFilterActive = false;
  applyFilter();
});

// Init — apply FP visuals from localStorage, then build chips
applyAllFPVisuals();
buildFilterChips();
updateFilterSummary();
</script>
